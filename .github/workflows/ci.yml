name: CI

# Когда запускать
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# Что запускать
jobs:
  test:
    runs-on: ubuntu-latest

    # Сервисы (PostgreSQL для тестов)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction_user
          POSTGRES_PASSWORD: auction_password
          POSTGRES_DB: auction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Получаем код
      - uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Кэшируем зависимости
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # 5. Запускаем линтеры
      - name: Run linters
        run: |
          pip install flake8 black isort
          flake8 app tests
          black --check app tests
          isort --check-only app tests

      # 6. Запускаем тесты
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://auction_user:auction_password@localhost:5432/auction_test
          JWT_SECRET_KEY: test-secret-key
        run: |
          pytest -v --cov=app --cov-report=term-missing

  # Отдельная работа для проверки pre-commit
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
