{% extends "base.html" %}

{% block title %}{{ title }} | Auction Market{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Создать событие</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/events/create">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="title">Название</label>
            <input
                type="text"
                id="title"
                name="title"
                required
                minlength="3"
                value="{{ form_data.title if form_data else '' }}"
            >
        </div>

        <div class="form-group">
            <label for="description">Описание</label>
            <textarea
                id="description"
                name="description"
                rows="3"
            >{{ form_data.description if form_data else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="category">Категория</label>
            <input
                type="text"
                id="category"
                name="category"
                value="{{ form_data.category if form_data else '' }}"
            >
        </div>

        <div class="form-group">
            <label for="outcomes">Исходы (через запятую)</label>
            <input
                type="text"
                id="outcomes"
                name="outcomes"
                required
                placeholder="Team A, Team B, Draw"
                value="{{ form_data.outcomes if form_data else '' }}"
            >
            <small>Минимум 2 исхода, разделённых запятыми</small>
        </div>

        <button type="submit" class="btn">Создать</button>
        <a href="/events" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
